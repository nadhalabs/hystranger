services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nadha_relay
      POSTGRES_USER: nadha
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  signaling:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://nadha:local-development-only@postgres:5432/nadha_relay
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
